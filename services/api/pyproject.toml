[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-api"
version = "0.1.0"
description = "Nexova central API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "libpass[bcrypt]>=1.9.3",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.9",
    "resend>=2.0.0",
    "tinydb>=4.8",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
seed = "seed:main"

[tool.setuptools]
py-modules = ["seed", "models", "email_service", "password_resets"]
